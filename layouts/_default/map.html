{{ define "main" }}
{{ $travel := .Site.Data.travel }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" />

<section>
<header>
    <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title }}</h1>
    <p class="mt-2 text-base text-neutral-500 dark:text-neutral-400">
        {{ len $travel.countries }} countries &middot; {{ len (where $travel.places "park" true) }} US national parks &middot; {{ len $travel.places }} places
    </p>
    <p class="travel-flags mt-3 text-xl">
        {{- range $travel.countries }}<span title="{{ .name }}">{{ .flag }}</span>{{ end -}}
    </p>
</header>

<figure class="mt-8">
    <div id="travel-map" role="region" aria-label="Map of places visited"></div>
    <figcaption class="mt-2 text-xs text-neutral-400 dark:text-neutral-500">
        <span class="travel-legend"><span class="travel-home-dot"></span> Home</span>
        <span class="travel-legend"><span id="travel-park-icon"></span> National park</span>
    </figcaption>
</figure>
</section>

<style>
    .travel-flags { display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; }
    #travel-map { height: min(70vh, 80vw); min-height: 20rem; border-radius: 0.5rem; overflow: hidden; background: #aee2e0; }
    .dark #travel-map { background: rgb(var(--color-neutral-900)); }
    #travel-map .maplibregl-ctrl-attrib { font-size: 10px; }
    #travel-map .maplibregl-popup-content { padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; line-height: 1rem; background: rgb(var(--color-neutral-900)); color: rgb(var(--color-neutral)); box-shadow: 0 2px 8px rgb(0 0 0 / 0.2); }
    #travel-map .maplibregl-popup, #travel-map .maplibregl-popup-content { pointer-events: none; }
    #travel-map .maplibregl-popup-tip { display: none; }
    .dark #travel-map .maplibregl-popup-content { background: rgb(var(--color-neutral-100)); color: rgb(var(--color-neutral-900)); }
    .dark #travel-map .maplibregl-ctrl-group { background: rgb(var(--color-neutral-800)); }
    .dark #travel-map .maplibregl-ctrl-group button + button { border-top-color: rgb(var(--color-neutral-700)); }
    .dark #travel-map .maplibregl-ctrl-icon { filter: invert(1); }
    .dark #travel-map .maplibregl-ctrl-attrib { background: rgb(var(--color-neutral-800)); color: rgb(var(--color-neutral-400)); }
    .dark #travel-map .maplibregl-ctrl-attrib a { color: rgb(var(--color-neutral-300)); }
    .dark #travel-map .maplibregl-ctrl-attrib-button { filter: invert(1); }
    .travel-legend { display: inline-flex; align-items: center; gap: 0.25rem; margin-right: 0.75rem; }
    #travel-park-icon svg { width: 0.875rem; height: 0.875rem; }
    .travel-home-dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: #ffc100; }
</style>

<script id="travel-data" type="application/json">{{ $travel | jsonify | safeJS }}</script>
<script type="module">
    import "https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js";
    import { feature } from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

    const STYLES = {
        light: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
        dark: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    };
    const HOME_COLOR = "#ffc100";
    const PLACE_COLOR_LIGHT = "#ea4335";
    // Colours from the blog's original Snazzy Maps style (snazzymaps.com/style/482375), applied to Positron.
    const SNAZZY = {
        land: "#abce83",
        landcover: "#a4c67d",
        park: "#8dab68",
        building: "#a0c178",
        water: "#aee2e0",
        border: "#7aa36b",
        countryBorder: "#6d9660",
        highway: "#ebf4a4",
        arterial: "#9bbf72",
        local: "#a4c67d",
        casing: "#93b86a",
        rail: "#8fae6f",
        label: "#495421",
        roadLabel: "#5b5b3f",
        waterLabel: "#3f7f86",
    };
    const DEFAULT_BOUNDS = [[-131, 19], [-60, 54]];
    // Basemap labels and state borders appear this many zoom levels earlier than CARTO's defaults.
    const LABEL_ZOOM_SHIFT = 1.5;
    const STATE_LABEL_ZOOM_SHIFT = 0.5;

    const { countries, places } = JSON.parse(document.getElementById("travel-data").textContent);
    const visited = new Set(countries.map((c) => c.id));

    const toGeoJSON = (list) => ({
        type: "FeatureCollection",
        features: list.map((p) => ({
            type: "Feature",
            properties: { name: p.name, home: Boolean(p.home) },
            geometry: { type: "Point", coordinates: [p.lng, p.lat] },
        })),
    });
    const placesGeoJSON = toGeoJSON(places.filter((p) => !p.park));
    const parksGeoJSON = toGeoJSON(places.filter((p) => p.park));

    const world = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then((r) => r.json());
    const visitedGeoJSON = feature(world, world.objects.countries);
    visitedGeoJSON.features = visitedGeoJSON.features.filter((f) => visited.has(f.id));
    // world-atlas draws France with French Guiana; keep only its European polygons.
    for (const f of visitedGeoJSON.features) {
        if (f.id === "250" && f.geometry.type === "MultiPolygon") {
            f.geometry.coordinates = f.geometry.coordinates.filter((poly) => poly[0][0][0] > -20);
        }
    }

    const isDark = () => document.documentElement.classList.contains("dark");
    const themeColor = (name) => `rgb(${getComputedStyle(document.documentElement).getPropertyValue(name).trim()})`;

    const parkIconSVG = (fill, stroke) => `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="11" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
        <path d="M12 4.5l4.5 6h-2.25l3.25 4.5H6.5l3.25-4.5H7.5z" fill="#fff"/>
        <rect x="11" y="15" width="2" height="3.5" fill="#fff"/>
    </svg>`;
    const loadImage = (svg) => {
        const img = new Image();
        img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        return img.decode().then(() => img);
    };
    const parkFill = themeColor("--color-secondary-700");
    const [parkIconLight, parkIconDark] = await Promise.all([
        loadImage(parkIconSVG(parkFill, "#fff")),
        loadImage(parkIconSVG(parkFill, themeColor("--color-neutral-800"))),
    ]);
    document.getElementById("travel-park-icon").innerHTML = parkIconSVG(parkFill, "transparent");

    const snazzyPaint = (layer) => {
        const { id, type } = layer;
        if (type === "background") return { "background-color": SNAZZY.land };
        if (type === "fill") {
            if (id === "water") return { "fill-color": SNAZZY.water };
            if (id.startsWith("park_")) return { "fill-color": SNAZZY.park, "fill-opacity": 0.35 };
            if (id.startsWith("building")) return { "fill-color": SNAZZY.building };
            if (/^(landcover|landuse)/.test(id)) return { "fill-color": SNAZZY.landcover, "fill-opacity": 0.3 };
        }
        if (type === "line") {
            if (id === "waterway") return { "line-color": SNAZZY.water };
            if (id.startsWith("boundary_country")) return { "line-color": SNAZZY.countryBorder, "line-opacity": 1 };
            if (id.startsWith("boundary_")) return { "line-color": SNAZZY.border };
            if (id.includes("rail")) return { "line-color": id.endsWith("_dash") ? SNAZZY.landcover : SNAZZY.rail };
            if (id.includes("_case")) return { "line-color": SNAZZY.casing };
            if (/_(mot|trunk)_fill/.test(id)) return { "line-color": SNAZZY.highway };
            if (/_(pri|sec)_fill|aeroway/.test(id)) return { "line-color": SNAZZY.arterial };
            if (/minor|service|path/.test(id)) return { "line-color": SNAZZY.local };
        }
        if (type === "symbol") {
            if (/^(watername|waterway_label)/.test(id)) return { "text-color": SNAZZY.waterLabel, "text-halo-color": "rgba(255,255,255,0.6)" };
            if (/^(roadname|housenumber|poi)/.test(id)) return { "text-color": SNAZZY.roadLabel, "text-halo-color": SNAZZY.land };
            return { "text-color": SNAZZY.label, "text-halo-color": "#fff", "text-halo-width": 1.5 };
        }
        return {};
    };

    let currentStyle = isDark() ? STYLES.dark : STYLES.light;
    const map = new maplibregl.Map({
        container: "travel-map",
        style: currentStyle,
        bounds: DEFAULT_BOUNDS,
        fitBoundsOptions: { padding: 16 },
        cooperativeGestures: true,
        attributionControl: { compact: true },
        dragRotate: false,
        pitchWithRotate: false,
        touchPitch: false,
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.touchZoomRotate.disableRotation();

    // Re-run on every style load, since switching light/dark replaces the whole style.
    map.on("style.load", () => {
        const dark = isDark();

        for (const layer of map.getStyle().layers) {
            if (!/^(place_(state|city|town|villages|suburbs|hamlet|capital)|boundary_state)/.test(layer.id)) continue;
            const shift = layer.id === "place_state" ? STATE_LABEL_ZOOM_SHIFT : LABEL_ZOOM_SHIFT;
            const min = Math.max(0, (layer.minzoom ?? 0) - shift);
            const max = layer.maxzoom && layer.maxzoom < 24 ? layer.maxzoom - shift : 24;
            map.setLayerZoomRange(layer.id, min, max);
        }
        // CARTO only switches from macro-regions to state lines at zoom 6.
        if (map.getLayer("boundary_state")) map.setFilter("boundary_state", ["==", ["get", "kind_detail"], 4]);

        if (!dark) {
            for (const layer of map.getStyle().layers) {
                for (const [prop, value] of Object.entries(snazzyPaint(layer))) map.setPaintProperty(layer.id, prop, value);
            }
        } else {
            map.addSource("visited", { type: "geojson", data: visitedGeoJSON });
            // Drawn beneath the basemap's water so the coarse 110m coastlines don't spill into the sea.
            map.addLayer({
                id: "visited",
                type: "fill",
                source: "visited",
                paint: {
                    "fill-color": themeColor("--color-primary-700"),
                    "fill-opacity": ["interpolate", ["linear"], ["zoom"], 3, 0.35, 6, 0],
                },
            }, map.getLayer("water") ? "water" : undefined);
        }

        map.addSource("places", { type: "geojson", data: placesGeoJSON });
        map.addLayer({
            id: "places",
            type: "circle",
            source: "places",
            layout: { "circle-sort-key": ["case", ["get", "home"], 1, 0] },
            paint: {
                "circle-color": ["case", ["get", "home"], HOME_COLOR, dark ? themeColor("--color-primary-400") : PLACE_COLOR_LIGHT],
                "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, ["case", ["get", "home"], 4, 2.5], 8, ["case", ["get", "home"], 7, 5]],
                "circle-stroke-color": dark ? themeColor("--color-neutral-800") : "#fff",
                "circle-stroke-width": 1,
            },
        });

        if (map.hasImage("park")) map.removeImage("park");
        map.addImage("park", dark ? parkIconDark : parkIconLight, { pixelRatio: 2 });
        map.addSource("parks", { type: "geojson", data: parksGeoJSON });
        map.addLayer({
            id: "parks",
            type: "symbol",
            source: "parks",
            layout: {
                "icon-image": "park",
                "icon-size": ["interpolate", ["linear"], ["zoom"], 1, 0.45, 6, 1],
                "icon-allow-overlap": true,
                "icon-ignore-placement": true,
            },
        });
    });

    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
    const showName = (f) => {
        popup.setLngLat(f.geometry.coordinates).setText(f.properties.name).addTo(map);
    };
    const pointLayers = ["parks", "places"];
    map.on("mousemove", (e) => {
        const [f] = map.queryRenderedFeatures(e.point, { layers: pointLayers });
        map.getCanvas().style.cursor = f ? "pointer" : "";
        if (f) showName(f);
        else popup.remove();
    });
    map.on("click", (e) => {
        const [f] = map.queryRenderedFeatures(e.point, { layers: pointLayers });
        if (f) showName(f);
        else popup.remove();
    });

    new MutationObserver(() => {
        const next = isDark() ? STYLES.dark : STYLES.light;
        if (next !== currentStyle) {
            currentStyle = next;
            map.setStyle(next);
        }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
</script>
{{ end }}
