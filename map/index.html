 Arizona"},{"lat":33.4255,"lng":-111.94,"name":"Tempe, Arizona"},{"lat":34.8697,"lng":-111.761,"name":"Sedona, Arizona"},{"lat":35.1983,"lng":-111.6513,"name":"Flagstaff, Arizona"},{"lat":35.0242,"lng":-110.6974,"name":"Winslow, Arizona"},{"lat":34.9323,"lng":-109.763,"name":"Petrified Forest National Park, Arizona","park":true},{"lat":32.2226,"lng":-110.9747,"name":"Tucson, Arizona"},{"lat":32.2837,"lng":-111.2013,"name":"Saguaro National Park, Arizona","park":true},{"lat":33.6177,"lng":-114.5882,"name":"Blythe, California"},{"lat":45.8918,"lng":-123.9615,"name":"Cannon Beach, Oregon"},{"lat":46.2764,"lng":-122.2406,"name":"Mount St. Helens, Washington"},{"lat":45.2987,"lng":-121.7957,"name":"Mount Hood, Oregon"},{"lat":45.7054,"lng":-121.5215,"name":"Hood River, Oregon"},{"lat":45.5762,"lng":-122.1158,"name":"Multnomah Falls, Oregon"},{"lat":48.192,"lng":-114.3168,"name":"Kalispell, Montana"},{"lat":48.4106,"lng":-114.3375,"name":"Whitefish, Montana"},{"lat":48.3725,"lng":-114.1818,"name":"Columbia Falls, Montana"},{"lat":48.4952,"lng":-113.9811,"name":"West Glacier, Montana"},{"lat":48.6967,"lng":-113.7183,"name":"Glacier National Park, Montana","park":true}]}</script><script type=module>
    import "https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js";

    
    const mapEl = document.getElementById("travel-map");
    let fittedWidth = 0;
    const fitMapToWindow = () => {
        const width = document.documentElement.clientWidth;
        
        if (width === fittedWidth) return;
        fittedWidth = width;
        const caption = mapEl.nextElementSibling;
        const captionSpace = caption.offsetHeight + parseFloat(getComputedStyle(caption).marginTop) + 12;
        const top = mapEl.getBoundingClientRect().top + window.scrollY;
        mapEl.style.height = `${Math.max(320, window.innerHeight - top - captionSpace)}px`;
    };
    fitMapToWindow();
    window.addEventListener("resize", fitMapToWindow);
    import { feature } from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

    const STYLES = {
        light: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
        dark: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    };
    const HOME_COLOR = "#f0a500";
    const PLACE_COLOR = "#ea4335";
    
    const SNAZZY = {
        land: "#abce83",
        landcover: "#a4c67d",
        park: "#8dab68",
        building: "#a0c178",
        water: "#aee2e0",
        border: "#7aa36b",
        countryBorder: "#6d9660",
        highway: "#ebf4a4",
        arterial: "#9bbf72",
        local: "#a4c67d",
        casing: "#93b86a",
        rail: "#8fae6f",
        label: "#495421",
        roadLabel: "#5b5b3f",
        waterLabel: "#3f7f86",
    };
    
    const DARK_LAND = "#121811";
    const DARK_TWEAKS = {
        background: { "background-color": DARK_LAND },
        landcover: { "fill-color": DARK_LAND },
        landuse: { "fill-color": DARK_LAND },
        park_national_park: { "fill-color": "#18241a" },
        park_nature_reserve: { "fill-color": "#18241a" },
        water: { "fill-color": "#1e3435" },
        waterway: { "line-color": "#2b5254" },
        boundary_state: { "line-color": "#5a6c55" },
        boundary_country_inner: { "line-color": "#6f8068" },
    };
    const DEFAULT_BOUNDS = [[-131, 19], [-60, 54]];
    
    const PORTRAIT_BOUNDS = [[-125, 24], [-66.5, 49.5]];
    
    const LABEL_ZOOM_SHIFT = 1.5;
    const STATE_LABEL_ZOOM_SHIFT = 0.5;

    const { countries, places } = JSON.parse(document.getElementById("travel-data").textContent);
    const visited = new Set(countries.map((c) => c.id));

    const toGeoJSON = (list) => ({
        type: "FeatureCollection",
        features: list.map((p) => ({
            type: "Feature",
            properties: { name: p.name, home: Boolean(p.home) },
            geometry: { type: "Point", coordinates: [p.lng, p.lat] },
        })),
    });
    const placesGeoJSON = toGeoJSON(places.filter((p) => !p.park));
    const parksGeoJSON = toGeoJSON(places.filter((p) => p.park));

    const world = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then((r) => r.json());
    const visitedGeoJSON = feature(world, world.objects.countries);
    visitedGeoJSON.features = visitedGeoJSON.features.filter((f) => visited.has(f.id));
    
    for (const f of visitedGeoJSON.features) {
        if (f.id === "250" && f.geometry.type === "MultiPolygon") {
            f.geometry.coordinates = f.geometry.coordinates.filter((poly) => poly[0][0][0] > -20);
        }
    }

    const isDark = () => document.documentElement.classList.contains("dark");
    const themeColor = (name) => `rgb(${getComputedStyle(document.documentElement).getPropertyValue(name).trim()})`;

    const GLYPHS = {
        park: `<path d="M12 4.5l4.5 6h-2.25l3.25 4.5H6.5l3.25-4.5H7.5z"/><rect x="11" y="15" width="2" height="3.5"/>`,
        home: `<path d="M12 5l7 6h-2v7h-3.5v-4.5h-3V18H7v-7H5z"/>`,
    };
    const badgeSVG = (glyph, fill, stroke) => `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="11" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
        <g fill="#fff">${GLYPHS[glyph]}</g>
    </svg>`;
    const loadImage = (svg) => {
        const img = new Image();
        img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        return img.decode().then(() => img);
    };
    const BADGE_FILL = { park: themeColor("--color-secondary-700"), home: HOME_COLOR };
    const badges = {};
    for (const glyph of ["park", "home"]) {
        badges[glyph] = {
            light: await loadImage(badgeSVG(glyph, BADGE_FILL[glyph], "#fff")),
            dark: await loadImage(badgeSVG(glyph, BADGE_FILL[glyph], DARK_LAND)),
        };
        document.getElementById(`travel-${glyph}-icon`).innerHTML = badgeSVG(glyph, BADGE_FILL[glyph], "transparent");
    }

    const snazzyPaint = (layer) => {
        const { id, type } = layer;
        if (type === "background") return { "background-color": SNAZZY.land };
        if (type === "fill") {
            if (id === "water") return { "fill-color": SNAZZY.water };
            if (id.startsWith("park_")) return { "fill-color": SNAZZY.park, "fill-opacity": 0.35 };
            if (id.startsWith("building")) return { "fill-color": SNAZZY.building };
            if (/^(landcover|landuse)/.test(id)) return { "fill-color": SNAZZY.landcover, "fill-opacity": 0.3 };
        }
        if (type === "line") {
            if (id === "waterway") return { "line-color": SNAZZY.water };
            if (id.startsWith("boundary_country")) return { "line-color": SNAZZY.countryBorder, "line-opacity": 1 };
            if (id.startsWith("boundary_")) return { "line-color": SNAZZY.border };
            if (id.includes("rail")) return { "line-color": id.endsWith("_dash") ? SNAZZY.landcover : SNAZZY.rail };
            if (id.includes("_case")) return { "line-color": SNAZZY.casing };
            if (/_(mot|trunk)_fill/.test(id)) return { "line-color": SNAZZY.highway };
            if (/_(pri|sec)_fill|aeroway/.test(id)) return { "line-color": SNAZZY.arterial };
            if (/minor|service|path/.test(id)) return { "line-color": SNAZZY.local };
        }
        if (type === "symbol") {
            if (/^(watername|waterway_label)/.test(id)) return { "text-color": SNAZZY.waterLabel, "text-halo-color": "rgba(255,255,255,0.6)" };
            if (/^(roadname|housenumber|poi)/.test(id)) return { "text-color": SNAZZY.roadLabel, "text-halo-color": SNAZZY.land };
            return { "text-color": SNAZZY.label, "text-halo-color": "#fff", "text-halo-width": 1.5 };
        }
        return {};
    };

    let currentStyle = isDark() ? STYLES.dark : STYLES.light;
    const map = new maplibregl.Map({
        container: "travel-map",
        style: currentStyle,
        bounds: mapEl.clientWidth < mapEl.clientHeight ? PORTRAIT_BOUNDS : DEFAULT_BOUNDS,
        fitBoundsOptions: { padding: 16 },
        cooperativeGestures: true,
        attributionControl: { compact: true },
        dragRotate: false,
        pitchWithRotate: false,
        touchPitch: false,
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.touchZoomRotate.disableRotation();

    
    map.on("style.load", () => {
        const dark = isDark();

        for (const layer of map.getStyle().layers) {
            if (!/^(place_(state|city|town|villages|suburbs|hamlet|capital)|boundary_state)/.test(layer.id)) continue;
            const shift = layer.id === "place_state" ? STATE_LABEL_ZOOM_SHIFT : LABEL_ZOOM_SHIFT;
            const min = Math.max(0, (layer.minzoom ?? 0) - shift);
            const max = layer.maxzoom && layer.maxzoom < 24 ? layer.maxzoom - shift : 24;
            map.setLayerZoomRange(layer.id, min, max);
        }
        
        if (map.getLayer("boundary_state")) map.setFilter("boundary_state", ["==", ["get", "kind_detail"], 4]);

        for (const layer of map.getStyle().layers) {
            const paint = dark ? DARK_TWEAKS[layer.id] ?? {} : snazzyPaint(layer);
            for (const [prop, value] of Object.entries(paint)) map.setPaintProperty(layer.id, prop, value);
        }
        if (dark) {
            map.addSource("visited", { type: "geojson", data: visitedGeoJSON });
            
            map.addLayer({
                id: "visited",
                type: "fill",
                source: "visited",
                paint: {
                    "fill-color": themeColor("--color-primary-700"),
                    "fill-opacity": ["interpolate", ["linear"], ["zoom"], 3, 0.35, 6, 0],
                },
            }, map.getLayer("water") ? "water" : undefined);
        }

        map.addSource("places", { type: "geojson", data: placesGeoJSON });
        map.addLayer({
            id: "places",
            type: "circle",
            source: "places",
            filter: ["!", ["get", "home"]],
            paint: {
                "circle-color": dark ? themeColor("--color-primary-400") : PLACE_COLOR,
                "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, 2.5, 8, 5],
                "circle-stroke-color": dark ? DARK_LAND : "#fff",
                "circle-stroke-width": 1,
            },
        });

        const addBadgeLayer = (id, source, glyph, filter) => {
            if (map.hasImage(glyph)) map.removeImage(glyph);
            map.addImage(glyph, badges[glyph][dark ? "dark" : "light"], { pixelRatio: 2 });
            map.addLayer({
                id,
                type: "symbol",
                source,
                ...(filter && { filter }),
                layout: {
                    "icon-image": glyph,
                    "icon-size": ["interpolate", ["linear"], ["zoom"], 1, 0.45, 6, 1],
                    "icon-allow-overlap": true,
                    "icon-ignore-placement": true,
                },
            });
        };
        map.addSource("parks", { type: "geojson", data: parksGeoJSON });
        addBadgeLayer("parks", "parks", "park");
        addBadgeLayer("homes", "places", "home", ["get", "home"]);
    });

    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
    const showName = (f) => {
        popup.setLngLat(f.geometry.coordinates).setText(f.properties.name).addTo(map);
    };
    const pointLayers = ["homes", "parks", "places"];
    map.on("mousemove", (e) => {
        const [f] = map.queryRenderedFeatures(e.point, { layers: pointLayers });
        map.getCanvas().style.cursor = f ? "pointer" : "";
        if (f) showName(f);
        else popup.remove();
    });
    map.on("click", (e) => {
        const [f] = map.queryRenderedFeatures(e.point, { layers: pointLayers });
        if (f) showName(f);
        else popup.remove();
    });

    let lastRandom = -1;
    let flight = 0;
    document.getElementById("travel-random").addEventListener("click", () => {
        let i;
        do i = Math.floor(Math.random() * places.length);
        while (i === lastRandom && places.length > 1);
        lastRandom = i;
        const { name, lat, lng, park } = places[i];
        const id = ++flight;
        popup.remove();
        map.flyTo({ center: [lng, lat], zoom: park ? 8 : 10, speed: 1.4 });
        
        map.once("moveend", () => id === flight && popup.setLngLat([lng, lat]).setText(name).addTo(map));
    });

    new MutationObserver(() => {
        const next = isDark() ? STYLES.dark : STYLES.light;
        if (next !== currentStyle) {
            currentStyle = next;
            map.setStyle(next);
        }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
